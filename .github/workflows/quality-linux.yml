name: quality-linux
# Linux job set: real MySQL API tests, Python tests, frontend, build and the two browser E2E flows.
# The Windows workflow (quality.yml) stays as the cross-platform contract check.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-linux-${{ github.ref }}
  cancel-in-progress: true
env:
  MYSQL_ROOT_PASSWORD: ci-root-password
  # Test-only credentials for a throw-away service container; never used outside CI.
  TEST_DATABASE_SERVER_URL: mysql://knot:knot-dev-password@127.0.0.1:3306
  E2E_DATABASE_URL: mysql://knot:knot-dev-password@127.0.0.1:3306/knot_e2e
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm test -- --reporter=dot
      - run: npm run build
      - name: Unreachable modules (informational)
        run: npm run unused:modules

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Test account (native password, as the mariadb driver requires)
        run: |
          mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
            CREATE USER 'knot'@'%' IDENTIFIED WITH mysql_native_password BY 'knot-dev-password';
            GRANT ALL PRIVILEGES ON *.* TO 'knot'@'%'; FLUSH PRIVILEGES;"
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm run test:unit -- --runInBand
        working-directory: backend
      - run: npm run test:api -- --runInBand
        working-directory: backend
      - run: npm run build
        working-directory: backend

  python:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'False'
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend, python]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: Test account and database
        run: |
          mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
            CREATE USER 'knot'@'%' IDENTIFIED WITH mysql_native_password BY 'knot-dev-password';
            GRANT ALL PRIVILEGES ON *.* TO 'knot'@'%'; CREATE DATABASE knot_e2e; FLUSH PRIVILEGES;"
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: python -m pip install -e 'ai-service[dev]'
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run build
        working-directory: backend
      - name: Browser E2E (exam flow, a11y scans, print)
        run: npm run test:e2e:exam
        env: { PYTHON: python }
      - name: Browser E2E (offline progress outbox)
        run: npm run test:e2e:outbox
        env: { PYTHON: python }
