name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=dot
      - run: npm run build
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:unit -- --runInBand
        working-directory: backend
      - run: npm run build
        working-directory: backend
  python-contracts:
    runs-on: windows-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'False'
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - run: python -m pip install -c constraints-windows-py314.txt -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -q
# Real MySQL/API, media and local model acceptance are separate opt-in runs.
# These jobs prove contracts/builds, not educational correctness or model quality.
