name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbidden files (env, credentials, runtime storage, PDFs)
        run: scripts/check-forbidden-files.sh --all
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" gitleaks && sudo mv gitleaks /usr/local/bin/
      # Only the history of the tested commit: checkout fetches every branch, and gitleaks scans
      # all refs by default, which would re-report other (already known) branches.
      - name: Gitleaks (full history of this commit, redacted)
        run: gitleaks git --log-opts="HEAD" --redact --verbose --no-banner --config .gitleaks.toml .
